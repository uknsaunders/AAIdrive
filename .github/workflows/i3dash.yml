name: i3 Dash

# Builds the installable i3 Dash app every time the code changes,
# and publishes it on the "latest" release page for downloading on the phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch version tags from the original project
        run: |
          git remote add upstream https://github.com/BimmerGestalt/AAIdrive.git || true
          git fetch --tags upstream || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Prepare cached external dependencies
        uses: actions/cache@v4
        with:
          key: aaidrive_external_${{ hashFiles('.github/actions/download-externals-action/download.sh') }}
          path: |
            external

      - name: Download build dependencies
        uses: ./.github/actions/download-externals-action

      - name: Build i3 Dash
        run: ./gradlew assembleNomapNonalyticsFullDebug --stacktrace

      - name: Name the app file
        run: |
          mkdir dist
          cp app/build/outputs/apk/nomapNonalyticsFull/debug/*.apk dist/i3-dash.apk
          ls -la dist

      - name: Keep a copy with this build
        uses: actions/upload-artifact@v4
        with:
          name: i3-dash
          path: dist/i3-dash.apk
          retention-days: 14

      - name: Publish to the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: i3dash-latest
          name: i3 Dash (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest i3 Dash build from commit ${{ github.sha }}.
            Download **i3-dash.apk** on your phone and open it to install.
          files: dist/i3-dash.apk
