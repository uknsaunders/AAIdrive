<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>i3 Dash</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
/* i3 Dash for the iDrive screen: drawn on the phone, sent to the car as pictures.
   Wide layout: top strip, car + stats on the left third, sat nav on the right two-thirds.
   No touch: the iDrive knob turns between pages. */
@font-face{font-family:"Inter";src:url(fonts/Inter-Regular.otf);font-weight:400}
@font-face{font-family:"Inter";src:url(fonts/Inter-Medium.otf);font-weight:500}
@font-face{font-family:"Inter";src:url(fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:"Inter";src:url(fonts/Inter-Bold.otf);font-weight:700}
/* the iDrive draws its own status bar across the top and its sidebar arc down the left,
   so everything is kept inside these margins */
:root{--safe-top:46px;--safe-left:40px;--safe-right:84px;--safe-bottom:6px}
:root{
  --bg:#0a0e13; --panel:#111821; --panel2:#18212c; --line:#243243; --ink:#e7edf4; --muted:#8597ab;
  --accent:#4c93ff; --accent-ink:#06101f; --good:#2fd49a; --warn:#f2a73b; --bad:#ff6b6b;
  --f-d:"Inter",system-ui,sans-serif; --f-b:"Inter",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-b);overflow:hidden}
*{box-sizing:border-box}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums}
.lbl{font:600 16px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#app{display:grid;grid-template-rows:60px 1fr;height:100vh;width:100vw;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left)}
header{display:flex;align-items:flex-end;gap:14px;padding:0 6px 5px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:700 18px var(--f-d)}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.tabs{display:flex;align-items:baseline;gap:16px;padding-bottom:4px;min-width:0}
.tabs b{font:700 27px var(--f-d);white-space:nowrap}
.tabs span{font:500 20px var(--f-b);color:var(--muted);white-space:nowrap}
.tabs span i{font-style:normal;color:var(--accent);font-weight:600}
.sp{flex:1}
.wxb{display:flex;align-items:center;gap:6px;margin-left:12px;font:600 28px var(--f-d)}
.wxi svg{width:32px;height:32px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.clock{font:600 20px var(--f-d)}
.body{position:relative;display:grid;grid-template-columns:50% 1fr;min-height:0}
.body.wide{grid-template-columns:0 1fr}
aside{position:relative;padding:8px 10px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);overflow:hidden;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.soc{font:700 56px var(--f-d);line-height:.85}.soc small{font-size:26px;color:var(--muted)}
.spd{font:600 40px var(--f-d);line-height:1;text-align:right}
.carzone{position:relative;flex:1 1 auto;min-height:0;display:flex;justify-content:center}
.ovl{position:absolute;left:2px;top:0}.ovr{position:absolute;right:2px;top:0;text-align:right}
.carzone .carwrap{flex:none;align-self:stretch;width:auto;max-width:none;margin:0}
.carwrap{position:relative;flex:1 1 auto;min-height:0;max-width:100%;margin:0 auto;aspect-ratio:857/498;background:radial-gradient(ellipse at 50% 60%,#243245,transparent 70%)}
.carwrap img{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;transform:translate(-50%,-50%);font:600 20px var(--f-d);background:rgba(10,14,19,.75);border-radius:4px;padding:0 5px;white-space:nowrap}
.tag:empty{display:none}
.ty{display:none;position:absolute;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;border:5px solid var(--warn);box-shadow:0 0 16px var(--warn),inset 0 0 16px var(--warn);z-index:3}
.ty.low,.ty.bad{display:block}.ty.bad{border-color:var(--bad);box-shadow:0 0 16px var(--bad),inset 0 0 16px var(--bad)}
.ty i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 22px var(--f-d);white-space:nowrap;background:rgba(10,14,19,.85);border-radius:5px;padding:0 6px;font-style:normal}
.dot{position:absolute;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);background:rgba(76,147,255,.5)}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.pbar .f{position:absolute;top:0;bottom:0}
.pbar .z{position:absolute;left:37.5%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.pscale{display:flex;justify-content:space-between;font-size:16px;color:var(--muted);margin-top:2px}
.m{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;min-width:0}
.m .k{font:600 18px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .v{font:600 32px var(--f-d);line-height:1.1;white-space:nowrap}
.m .v small{font:500 17px var(--f-b);color:var(--muted);margin-left:2px}
.frost{position:absolute;inset:0;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(24,33,44,.55),rgba(10,14,19,.8));backdrop-filter:blur(7px)}
.frost h2{margin:0;font:600 30px var(--f-d)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 16px;margin:0;font-size:23px}
.kv dt{color:#a9b8c8}.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.np{position:absolute;right:12px;top:12px;width:min(56%,420px);display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border-radius:10px;background:rgba(17,24,33,.62);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);z-index:3}
.np img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:var(--panel2)}
.np .t{font:600 20px var(--f-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np .a{font:500 16px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .x{min-width:0;flex:1}.np .st{font:600 18px var(--f-d);color:var(--muted)}
.mus{display:flex;gap:16px;align-items:center;margin-top:4px}
.mus img{width:180px;height:180px;border-radius:12px;object-fit:cover;flex:none;background:var(--panel2);box-shadow:0 6px 24px rgba(0,0,0,.45)}
.mus .t{font:600 32px var(--f-d);line-height:1.1}.mus .a{font:500 23px var(--f-b);color:#c3cfdb;margin-top:4px}.mus .al{font:500 19px var(--f-b);color:var(--muted);margin-top:2px}
.src{display:inline-flex;align-items:center;gap:6px;font:600 16px var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.src i{width:8px;height:8px;border-radius:50%;background:var(--good)}.src i.p{background:var(--muted)}
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.prog b{display:block;height:100%;background:var(--ink)}
.times{display:flex;justify-content:space-between;font:500 17px var(--f-d);color:var(--muted);margin-top:3px}
.hint{margin-top:auto;color:var(--muted);font-size:17px}
.nav{position:relative;min-width:0;overflow:hidden;background:#141b23}
#map{position:absolute;inset:0}
/* the next turn and the now-playing strip share the top of the map without touching */
.turn:not([hidden])~.np{width:min(40%,420px)}
.turn{position:absolute;left:12px;top:12px;max-width:54%;display:flex;gap:12px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:9px 14px}
.turn svg{width:44px;height:44px;flex:none;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.turn .d{font:700 36px var(--f-d);line-height:1}
.turn .i{font:600 21px var(--f-b)}
.eta{position:absolute;left:12px;bottom:12px;display:flex;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 14px}
.eta b{display:block;font:600 30px var(--f-d);line-height:1.05}
.puck{position:absolute;left:50%;top:72%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);display:grid;place-items:center;z-index:5}
.puck i{width:26px;height:26px;border-radius:50%;background:#1660d0;display:grid;place-items:center}
.puck svg{width:15px;height:15px;fill:#fff}
.mapmsg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:18px;text-align:center;max-width:70%}
.call{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:22px 26px;background:rgba(10,14,19,.74);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:12px}
.call .cn{font:700 46px var(--f-d);line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call .cs{font:500 22px var(--f-b);color:#c3cfdb}
.call .cd{font:700 40px var(--f-d);color:var(--good);line-height:1}
.call .ci{width:58px;height:58px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.call .ci svg{width:32px;height:32px;fill:#fff}
.al-row{background:rgba(255,255,255,.06);border-radius:9px;padding:6px 10px}
.al-app{font:600 14px var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.al-t{font:600 20px var(--f-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-x{font:500 16px var(--f-b);color:#c3cfdb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;top:0;left:0;bottom:0;width:50%;z-index:9;background:var(--bg);border-right:2px solid var(--accent);padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.mt{display:flex;justify-content:space-between;align-items:baseline;font:700 23px var(--f-d);padding:0 8px 5px;border-bottom:1px solid var(--line);margin-bottom:2px}
.mt small{font:500 16px var(--f-b);color:var(--muted)}
.mi{height:46px;flex:none;border-radius:10px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 25px var(--f-b);background:var(--panel2);border:1px solid var(--line)}
.mi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mi small{font:500 17px var(--f-b);color:var(--muted);white-space:nowrap;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.mi b{font:700 26px var(--f-d);color:var(--muted);flex:none}
.mi.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.mi.on small,.mi.on b{color:var(--accent-ink)}
.mi.dim{color:var(--muted);font-size:20px}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:10;font:600 22px var(--f-b);background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:8px 18px;white-space:nowrap}
/* the home screen: one card for each part of the app */
.home{position:absolute;inset:0;z-index:11;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:10px;padding:10px 4px 6px}
.card{position:relative;border-radius:16px;border:2px solid var(--line);background:var(--panel2);padding:14px 18px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.card svg{width:54px;height:54px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card .ct{font:700 31px var(--f-d);line-height:1.1}
.card .cx{font:500 19px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.card.on{background:var(--accent);border-color:#cfe2ff;color:var(--accent-ink)}
.card.on svg{stroke:var(--accent-ink)}.card.on .cx{color:var(--accent-ink)}
.card .cb{position:absolute;top:14px;right:16px;font:700 20px var(--f-d);background:var(--bad);color:#fff;border-radius:14px;padding:1px 11px}
.hometitle{font:600 21px var(--f-b);color:var(--muted);padding-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hometitle b{color:var(--ink);font-weight:700}
/* a new message drops in over the top of the screen for a few seconds */
.banner{position:absolute;left:12px;top:8px;width:calc(50% - 24px);z-index:12;display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:8px 16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.banner .ba{font:700 24px var(--f-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .bx{font:500 19px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .bk{margin-left:auto;font:600 18px var(--f-b);color:var(--accent);white-space:nowrap}
.banner>div{min-width:0}
.leaflet-container{background:#141b23}
body.daymap .leaflet-container{background:#e9e6df}
body.daymap .maplibregl-ctrl-attrib{background:rgba(255,255,255,.7)!important;color:#333!important}body.daymap .maplibregl-ctrl-attrib a{color:#333!important}
.maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(10,14,19,.6)!important;color:var(--muted)!important}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="tabs" id="tabs"></div>
    <div class="hometitle" id="hometitle" hidden>Turn the knob to choose · press to open</div>
    <span class="wxb"><span class="wxi" id="wxi"></span><span class="num" id="wx">--</span></span>
  </header>
  <div class="body" id="body">
    <aside>
      <div class="carzone">
        <div class="ovl"><div class="lbl">Battery</div><div class="soc num"><span id="soc">--</span><small>%</small></div></div>
        <div class="ovr"><div class="lbl">Speed</div><div class="spd num"><span id="spd">--</span> <span class="lbl" id="spdU">mph</span></div></div>
      <div class="carwrap">
        <img id="car" src="cars/mineral-grey--black.webp" alt="">
        <span class="dot" style="left:72.3%;top:22%"></span><span class="tag" id="tgCabin" style="left:80%;top:22%"></span>
        <span class="ty" id="ty-fl" style="left:18%;top:75%"></span><span class="ty" id="ty-fr" style="left:57.7%;top:76%"></span>
        <span class="ty" id="ty-rl" style="left:78%;top:66%"></span><span class="ty" id="ty-rr" style="left:93%;top:68%"></span>
      </div>
      </div>
      <div><div class="pbar"><div class="f" id="pf"></div><div class="z"></div></div>
        <div class="pscale"><span>regen</span><span id="pwTxt">--</span><span>drive</span></div></div>
      <div class="g3">
        <div class="m"><div class="k">Car range</div><div class="v" id="rCar">--</div></div>
        <div class="m"><div class="k">Journey rate</div><div class="v" id="rJ">--</div></div>
        <div class="m"><div class="k">Eco Pro +</div><div class="v" id="rEco">--</div></div>
        <div class="m"><div class="k">Journey</div><div class="v" id="jDist">--</div></div>
        <div class="m"><div class="k">Efficiency</div><div class="v" id="jEff">--</div></div>
        <div class="m"><div class="k">Car average</div><div class="v" id="jAvg">--</div></div>
      </div>
      <div id="panel"></div>
      <div class="call" id="call" hidden></div>
    </aside>
    <section class="nav">
      <div id="map"></div>
      <div class="puck"><i><svg viewBox="0 0 24 24"><path d="M12 3l7 17-7-4-7 4z"/></svg></i></div>
      <div class="turn" id="turn" hidden><svg viewBox="0 0 48 48"><g id="arrow"><path d="M24 44V16M14 26l10-10 10 10"/></g></svg><div><div class="d num" id="turnD">--</div><div class="i" id="turnI">--</div></div></div>
      <div class="eta" id="eta" hidden>
        <div><b class="num" id="eArr">--</b><span class="lbl">Arrive</span></div>
        <div><b class="num" id="eRem">--</b><span class="lbl">To go</span></div>
        <div><b class="num" id="eBat" style="color:var(--good)">--</b><span class="lbl">Battery on arrival</span></div>
      </div>
      <div class="mapmsg" id="mapmsg" hidden></div>
      <div class="np" id="np" hidden></div>
      <div class="lim" id="lim" hidden></div>
      <div class="diag" id="diag"></div>
    </section>
    <div class="home" id="home" hidden></div>
    <div class="menu" id="menu" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="banner" id="banner" hidden></div>
  </div>
</div>

<script src="lib/maplibre-gl.js"></script>
<script src="lib/leaflet.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const _c=new Map();
function T(sel,v){v=String(v);if(_c.get(sel+'t')===v)return;_c.set(sel+'t',v);$(sel).textContent=v}
function H(sel,v){v=String(v);if(_c.get(sel+'h')===v)return;_c.set(sel+'h',v);$(sel).innerHTML=v}
function S(el,k,v){if(el.style[k]!==v)el.style[k]=v}
const N=window.I3Native||{speak(){},log(){},navigationEnded(){},menu(){return '{}'},navStarted(){},search(){},answer(){},hangup(){},dial(){},media(){},musicOpen(){},musicPick(){},video(){return 'nocar'}};
const log=m=>{try{N.log(String(m))}catch(e){}};
const store={get(k,d){try{const v=localStorage.getItem('i3.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('i3.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- settings ---------- */
const USABLE_KWH=store.get('usableKwh',27.2);   // 94 Ah pack; 60 Ah = 18.8, 120 Ah = 37.9
const PAINTS=['mineral-grey','capparis-white','fluid-black','ionic-silver','laurus-grey','melbourne-red','imperial-blue','galvanic-gold','jucaro-beige'];
const PAINT_NAMES=['Mineral Grey','Capparis White','Fluid Black','Ionic Silver','Laurus Grey','Melbourne Red','Imperial Blue','Galvanic Gold','Jucaro Beige'];
const BELTS=['black','body','frozen-grey','i-blue'],BELT_NAMES=['Black','Body colour','Frozen Grey','BMW i Blue'];
let paint=store.get('paint',0); // index into body*4+belt
function paintCar(){const b=Math.floor(paint/4)%9,e=paint%4;$('#car').src='cars/'+PAINTS[b]+'--'+BELTS[e]+'.webp'}
paintCar();

/* ---------- live data from the car ---------- */
const D={};let miles=true,fahr=false;
const MI=0.621371;
const f=(v,d=0)=>v==null||isNaN(v)?'--':(+v).toFixed(d);
const dist=km=>miles?km*MI:km, du=()=>miles?'mi':'km';
const temp=c=>fahr?c*1.8+32:c, tu=()=>fahr?'°F':'°C';
const sm=(v,u)=>v==='--'?'--':v+'<small>'+u+'</small>';

/* journey: starts when the car first reports data, resets after 30 minutes without data */
let J=store.get('journey',null),trips=store.get('trips',[]);
function journeyTick(){
  const now=Date.now();
  if(!J||now-J.last>30*60000){
    if(J&&J.km>0.3){trips.unshift({start:J.start,end:J.last,km:J.km,kwh:J.kwh});trips=trips.slice(0,600);store.set('trips',trips)}
    J={start:now,last:now,km:0,kwh:0,odo0:D.odoKm??null,soc0:D.soc??null,lastSpeedT:now};
  }
  if(J.odo0==null&&D.odoKm!=null)J.odo0=D.odoKm;
  if(J.soc0==null&&D.soc!=null)J.soc0=D.soc;
  const dt=(now-J.lastSpeedT)/3600000;J.lastSpeedT=now;
  if(D.odoKm!=null&&J.odo0!=null&&D.odoKm-J.odo0>=1)J.km=D.odoKm-J.odo0;
  else if(D.speedKmh!=null)J.km+=D.speedKmh*Math.min(dt,0.01);
  if(D.soc!=null&&J.soc0!=null)J.kwh=Math.max(0,(J.soc0-D.soc)/100*USABLE_KWH);
  J.last=now;store.set('journey',J);
}
function kmPerKwh(){
  if(J&&J.km>3&&J.kwh>0.3)return J.km/J.kwh;
  if(D.avgConsumption){const u=String(D.avgConsumptionUnit||'');if(/MI|MPKWH|MILE/i.test(u))return D.avgConsumption/MI;return 100/D.avgConsumption}
  return 6.3;
}

window.i3feed=function(d){
  Object.assign(D,d);
  if(D.units){const [dd,tt]=String(D.units).split(',');miles=dd==='Miles';fahr=tt==='FAHRENHEIT'}
  journeyTick();render();
  if(D.lat!=null)onPosition(D.lat,D.lon,D.heading);
};

/* ---------- pages, turned with the iDrive knob ---------- */
const PAGES=['Car','Music','Call','Battery','Journey','Alerts','Map','Info'];let page=0,home=true,homeSel=0;
window.i3knob=function(dir){

/* tyre pressures: found by name among whatever tyre-related data the car sends, shown only when low */
const TY_LOW=1.9,TY_BAD=1.6;
function tyreScan(){
  const out={};
  const walk=(o,path)=>{
    if(o&&typeof o==='object'){for(const k in o)walk(o[k],path+'.'+k);return}
    if(typeof o!=='number'||[0,255,1023,4095,65535].includes(o))return;
    const w=path.replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().split(/[^a-z]+/).filter(Boolean);
    if(w.some(x=>/^(temp|temperature|warn|warning|status|state|flag|mode|threshold|target|setpoint)$/.test(x)))return;
    const has=a=>w.some(x=>a.includes(x));
    const fr=has(['front','fl','fr','vl','vr','vorn','vorne']),re=has(['rear','back','rl','rr','hl','hr','hinten']);
    const le=has(['left','fl','rl','vl','hl','links','l']),ri=has(['right','fr','rr','vr','hr','rechts','r']);
    if(fr===re||le===ri)return;
    out[(fr?'f':'r')+(le?'l':'r')]=o>=100?o/100:(o>=10?o/14.504:o);   // kPa, psi or bar
  };
  for(const k in D)if(k.startsWith('tyre:'))walk(D[k],k.slice(5));
  return out;
}
function drawTyres(){
  const v=tyreScan();
  for(const pos of ['fl','fr','rl','rr']){
    const el=$('#ty-'+pos),b=v[pos],low=b!=null&&b<TY_LOW;
    const cls='ty'+(low?(b<TY_BAD?' bad':' low'):'');
    if(el.className!==cls)el.className=cls;
    H('#ty-'+pos,low?'<i>'+pos.toUpperCase()+' '+b.toFixed(1)+' bar</i>':'');
  }
}
function tyreInfo(){
  const v=tyreScan(),keys=Object.keys(D).filter(k=>k.startsWith('tyre:'));
  if(Object.keys(v).length)return ['fl','fr','rl','rr'].map(p=>v[p]!=null?p.toUpperCase()+' '+v[p].toFixed(1):'').filter(Boolean).join('  ')+' bar';
  if(keys.length)return 'car sends '+keys.map(k=>k.slice(5)).join(', ')+' – '+JSON.stringify(D[keys[0]]).slice(0,60);
  return 'no tyre data from the car';
}
/* ---------- speed limit (OpenStreetMap road data) ---------- */
let lim=null,limKey='',limBusy=false,limTry=0;
const inJersey=p=>p[1]>49.1&&p[1]<49.3&&p[0]>-2.3&&p[0]<-1.95;
async function fetchLimit(){
  if(!pos||limBusy||Date.now()-limTry<7000)return;
  const key=Math.round(pos[1]*1500)+','+Math.round(pos[0]*1000);   // about 70 m cells
  if(key===limKey)return;
  limBusy=true;limTry=Date.now();
  try{
    const q='[out:json][timeout:8];way(around:22,'+pos[1].toFixed(5)+','+pos[0].toFixed(5)+')["highway"]["maxspeed"];out tags 6;';
    const j=await (await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q))).json();
    limKey=key;let best=null;
    for(const e of j.elements||[]){
      const m=String((e.tags||{}).maxspeed).match(/^(\d+)\s*(mph)?/);
      if(m){const v={v:+m[1],mph:!!m[2]||inJersey(pos)};if(!best||v.v<best.v)best=v}   // lowest at a junction, to be safe
    }
    lim=best;
  }catch(e){log('limit: '+e.message)}
  limBusy=false;
}
function limDisplay(){
  if(!lim)return null;
  return miles?(lim.mph?lim.v:Math.round(lim.v/1.609344/5)*5):(lim.mph?Math.round(lim.v*1.609344/5)*5:lim.v);
}
function drawLimit(){
  const el=$('#lim'),v=limDisplay();
  if(v==null){if(!el.hidden)el.hidden=true;return}
  if(el.hidden)el.hidden=false;
  const kmh=D.speedKmh!=null?D.speedKmh:(D.gpsSpeedMs!=null?D.gpsSpeedMs*3.6:null);
  const over=kmh==null?0:(miles?kmh*MI:kmh)-v;
  const cls='lim'+(over>8?' bad':over>0.5?' over':'');
  if(el.className!==cls)el.className=cls;
  H('#lim','<b>'+v+'</b>');

/* ---------- charging points (OpenStreetMap) ---------- */
let chargers=[],chgAt=null,chgTry=0,chgBusy=false,chgLayer=null;
async function fetchChargers(){
  if(!pos||chgBusy||Date.now()-chgTry<60000)return;
  if(chgAt&&hav(pos,chgAt)<3000)return;
  chgBusy=true;chgTry=Date.now();
  try{
    const q='[out:json][timeout:15];node["amenity"="charging_station"](around:20000,'+pos[1].toFixed(4)+','+pos[0].toFixed(4)+');out body 80;';
    const j=await (await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q))).json();
    chargers=(j.elements||[]).map(e=>({lon:e.lon,lat:e.lat,name:(e.tags&&(e.tags.name||e.tags.operator||e.tags.network))||'Charging point'}));
    chgAt=pos;drawChargers();
  }catch(e){log('chargers: '+e.message)}
  chgBusy=false;
}
function drawChargers(){
  const fc={type:'FeatureCollection',features:chargers.map(c=>({type:'Feature',geometry:{type:'Point',coordinates:[c.lon,c.lat]},properties:{name:c.name}}))};
  try{
    if(map&&map.getSource('chargers'))map.getSource('chargers').setData(fc);
    if(flat){if(chgLayer)chgLayer.clearLayers();else chgLayer=L.layerGroup().addTo(flat);
      chargers.forEach(c=>L.circleMarker([c.lat,c.lon],{radius:7,color:'#fff',weight:2,fillColor:'#19c37d',fillOpacity:1}).addTo(chgLayer))}
  }catch(e){log('draw chargers: '+e.message)}
}
function nearestCharger(){
  if(!pos||!chargers.length)return null;
  let best=null,bd=1e12;
  for(const c of chargers){const d=hav(pos,[c.lon,c.lat]);if(d<bd){bd=d;best=c}}
  return best?{c:best,d:bd}:null;
}

/* ---------- sat nav: MapLibre 3D map (OpenFreeMap), 2D fallback, OSRM routing ---------- */
let map=null,flat=null,flatRoute=null,pos=null,heading=0,route=null,spoken={};
const DEFAULT=[-2.035,49.195];
function mapMsg(t){const m=$('#mapmsg');m.textContent=t;m.hidden=!t}

function webglOk(){try{const c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'))}catch(e){return false}}
/* The map has a light style for daylight and a dark one for night, chosen from where the sun is.
   A dark map can't be read on the car's screen in sunshine. */
const STYLE={day:'https://tiles.openfreemap.org/styles/liberty',night:'https://tiles.openfreemap.org/styles/dark'};
const FLAT={day:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',night:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'};
let dayMap=null,dayBroken=false,flatTiles=null,routeGeo=null,styleTimer=0;
// is the sun up (or nearly) at this place and time? Standard low-precision solar position, good to a degree
function sunUp(lat,lon,ms){
  const r=Math.PI/180,d=ms/864e5-10957.5;
  const g=(357.529+0.98560028*d)*r,L=(280.459+0.98564736*d+1.915*Math.sin(g)+0.020*Math.sin(2*g))*r,e=(23.439-0.00000036*d)*r;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),dec=Math.asin(Math.sin(e)*Math.sin(L));
  const ha=((18.697374558+24.06570982441908*d)*15+lon)*r-ra;
  return Math.asin(Math.sin(lat*r)*Math.sin(dec)+Math.cos(lat*r)*Math.cos(dec)*Math.cos(ha))/r>-4;
}
function wantDay(){if(dayBroken)return false;const p=pos||store.get('lastPos',DEFAULT);return sunUp(p[1],p[0],Date.now())}
function mapTheme(){
  const day=wantDay();if(day===dayMap)return;
  dayMap=day;document.body.classList.toggle('daymap',day);log('map theme: '+(day?'day':'night'));
  try{
    if(flatTiles)flatTiles.setUrl(day?FLAT.day:FLAT.night);
    if(map){
      map.setStyle(day?STYLE.day:STYLE.night);
      // if the daylight style never arrives, go back to the dark one that is known to work
      clearTimeout(styleTimer);
      if(day)styleTimer=setTimeout(()=>{try{if(map&&!map.isStyleLoaded()){dayBroken=true;diag('Daylight map did not load, using the dark map');mapTheme()}}catch(e){}},15000);
    }
  }catch(e){log('map theme: '+e.message)}
}
// our own layers on top of whichever style is showing: the route, 3D buildings and chargers
function addMapLayers(){
  if(!map)return;
  const day=!!dayMap;
  try{
    if(!map.getSource('route'))map.addSource('route',{type:'geojson',data:routeGeo||{type:'FeatureCollection',features:[]}});
    if(!map.getLayer('route-casing'))map.addLayer({id:'route-casing',type:'line',source:'route',paint:{'line-color':day?'#ffffff':'#0b3d91','line-width':13},layout:{'line-cap':'round','line-join':'round'}});
    if(!map.getLayer('route'))map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':day?'#1668e3':'#4c93ff','line-width':8},layout:{'line-cap':'round','line-join':'round'}});
  }catch(e){log('route layer: '+e.message)}
  try{if(!map.getLayer('building-3d'))map.addLayer({id:'building-3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:14,
    paint:{'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-color':day?'#d9d4cc':'#2a3646','fill-extrusion-height':['coalesce',['get','render_height'],6],'fill-extrusion-opacity':0.85}},'route-casing')}catch(e){log('3d buildings: '+e.message)}
  try{if(!map.getSource('chargers'))map.addSource('chargers',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    if(!map.getLayer('chargers'))map.addLayer({id:'chargers',type:'circle',source:'chargers',paint:{'circle-radius':9,'circle-color':'#19c37d','circle-stroke-color':'#ffffff','circle-stroke-width':2.5}},'route-casing');
    drawChargers()}catch(e){log('chargers layer: '+e.message)}
}
function startFlatMap(reason){
  // 2D fallback that needs no graphics acceleration: raster map pictures (CARTO, from OpenStreetMap data)
  try{
    if(map){try{map.remove()}catch(e){}map=null}
    const c=store.get('lastPos',DEFAULT);
    flat=L.map('map',{zoomControl:false,attributionControl:true,dragging:false,keyboard:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,fadeAnimation:false,zoomAnimation:false}).setView([c[1],c[0]],16);
    const t=flatTiles=L.tileLayer(dayMap?FLAT.day:FLAT.night,{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'}).addTo(flat);
    t.on('tileerror',()=>diag('2D map: map pictures not loading — check mobile data'));
    t.on('load',()=>{mapMsg('');diag('');log('2D map ('+reason+')')});
    flatRoute=L.polyline([],{color:'#1668e3',weight:7}).addTo(flat);
    mapMsg('Loading map…');
  }catch(e){mapMsg('Map unavailable: '+e.message);diag('2D map failed: '+e.message)}
}
function startMap(){
  dayMap=wantDay();document.body.classList.toggle('daymap',dayMap);
  if(!window.maplibregl){startFlatMap('3D library missing');return}
  if(!webglOk()){startFlatMap('no 3D graphics here');return}
  try{
    map=new maplibregl.Map({container:'map',style:dayMap?STYLE.day:STYLE.night,center:store.get('lastPos',DEFAULT),zoom:16,pitch:60,bearing:0,
      interactive:false,attributionControl:{compact:true},fadeDuration:0,preserveDrawingBuffer:true});
    let loaded=false;
    map.on('style.load',()=>{addMapLayers();placeCamera()});
    map.on('load',()=>{
      loaded=true;
      try{document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');document.querySelector('.maplibregl-ctrl-attrib')?.removeAttribute('open')}catch(e){}
      addMapLayers();mapMsg('');diag('');placeCamera();
    });
    map.on('error',e=>{const m=(e&&e.error&&e.error.message)||'error';diag('3D map: '+m)});
    mapMsg('Loading map…');
    // if the daylight style hasn't arrived in 12 seconds, try the dark one; after 25 fall back to the 2D map
    setTimeout(()=>{if(!loaded&&dayMap){dayBroken=true;mapTheme()}},12000);
    setTimeout(()=>{if(!loaded)startFlatMap('3D map timed out')},25000);
  }catch(e){startFlatMap('3D failed: '+e.message)}
}
startMap();
setInterval(mapTheme,60000);
setTimeout(fetchWx,4000);setInterval(fetchWx,15*60000);
// quick internet check, shown on screen, so problems are easy to spot from the driver's seat
fetch('https://tiles.openfreemap.org/styles/dark',{cache:'no-store'}).then(r=>log('internet ok '+r.status)).catch(e=>diag('No internet from the phone ('+e.message+')'));
function placeCamera(){
  if(!pos)return;
  if(flat){flat.setView([pos[1],pos[0]],route?17:16,{animate:false});return}
  if(!map)return;
  const h=map.getContainer().clientHeight;
  map.jumpTo({center:pos,bearing:heading,pitch:60,zoom:route?16.5:16,padding:{top:h*0.45,bottom:0,left:0,right:0}});
}
let lastSaved=0;
function onPosition(lat,lon,hd){
  pos=[lon,lat];
  fetchLimit();fetchChargers();
  if(hd!=null&&!isNaN(hd))heading=((hd%360)+360)%360; // already turned into a compass bearing on the phone
  placeCamera();
  if(flat)S($('.puck svg'),'transform','rotate('+Math.round(heading)+'deg)');
  if(Date.now()-lastSaved>60000){lastSaved=Date.now();store.set('lastPos',pos)}
  if(route)navUpdate();
}

/* routing */
function hav(a,b){const r=Math.PI/180,dLa=(b[1]-a[1])*r,dLo=(b[0]-a[0])*r,s=Math.sin(dLa/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLo/2)**2;return 12742000*Math.asin(Math.sqrt(s))}
async function routeTo(lat,lon){
  const from=pos||store.get('lastPos',DEFAULT);
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${lon},${lat}?overview=full&geometries=geojson&steps=true`);
    const j=await r.json();if(!j.routes||!j.routes.length)throw new Error(j.message||'no route');
    const rt=j.routes[0],coords=rt.geometry.coordinates,cum=[0];
    for(let i=1;i<coords.length;i++)cum.push(cum[i-1]+hav(coords[i-1],coords[i]));
    const steps=[];let acc=0;for(const leg of rt.legs)for(const s of leg.steps){steps.push({at:acc,s});acc+=s.distance}
    const scale=cum[cum.length-1]/(acc||1);steps.forEach(x=>x.at*=scale);
    route={coords,cum,steps,total:cum[cum.length-1],dur:rt.duration,dest:[lon,lat],idx:0,along:0,off:0};spoken={};
    routeGeo={type:'Feature',geometry:rt.geometry};
    map&&map.getSource('route')&&map.getSource('route').setData(routeGeo);
    flatRoute&&flatRoute.setLatLngs(coords.map(c=>[c[1],c[0]]));
    $('#turn').hidden=false;$('#eta').hidden=false;navUpdate();
  }catch(e){log('route failed '+e.message);N.speak('Sorry, I could not find a route');}
}
window.i3navigate=(lat,lon,name)=>{home=false;page=0;showPage();routeTo(lat,lon);if(name)N.speak('Navigating to '+name)};
window.i3recalc=()=>{if(route)routeTo(route.dest[1],route.dest[0])};
window.i3stopNav=()=>{route=null;routeGeo=null;$('#turn').hidden=true;$('#eta').hidden=true;map&&map.getSource('route')&&map.getSource('route').setData({type:'FeatureCollection',features:[]});flatRoute&&flatRoute.setLatLngs([]);placeCamera()};
function project(p){
  const R=route,c=R.coords,lat0=p[1]*Math.PI/180,kx=111320*Math.cos(lat0),ky=110540;let best={d:1e12,along:R.along,i:R.idx};
  for(let i=Math.max(0,R.idx-30);i<Math.min(c.length-1,R.idx+400);i++){
    const ax=(c[i][0]-p[0])*kx,ay=(c[i][1]-p[1])*ky,bx=(c[i+1][0]-p[0])*kx,by=(c[i+1][1]-p[1])*ky,dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
    let t=l2?-(ax*dx+ay*dy)/l2:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);
    if(d<best.d)best={d,i,along:R.cum[i]+t*(R.cum[i+1]-R.cum[i])}}
  return best;
}
const MOD={straight:0,'slight right':40,right:90,'sharp right':135,uturn:180,'sharp left':-135,left:-90,'slight left':-40};
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:n%10<4?n%10:0]);
function stepText(s){const m=s.maneuver,mod=m.modifier||'',road=s.name||s.ref||'',to=road?' onto '+road:'';
  switch(m.type){case'depart':return'Head off'+(road?' on '+road:'');case'arrive':return'Arrive at your destination';
    case'roundabout':case'rotary':return'At the roundabout, take the '+ord(m.exit||1)+' exit'+to;case'roundabout turn':return'At the roundabout, turn '+mod+to;
    case'fork':return'Keep '+(mod.includes('left')?'left':'right')+to;case'end of road':return'At the end of the road, turn '+mod+to;
    case'continue':case'new name':return!mod||mod==='straight'?'Continue'+(road?' on '+road:''):'Bear '+mod+to;
    default:return mod==='straight'?'Continue'+to:mod?'Turn '+mod+to:'Continue'+to}}
function fmtD(m){if(miles){const mi=m/1609.34;return mi<0.1?Math.max(10,Math.round(m*1.0936/10)*10)+' yd':mi<10?mi.toFixed(1)+' mi':Math.round(mi)+' mi'}return m<1000?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km'}
function navUpdate(){
  if(!route||!pos)return;
  const pr=project(pos);route.idx=pr.i;
  if(pr.d>70){if(++route.off>=4){route.off=0;log('off route');window.i3recalc();return}}else route.off=0;
  route.along=Math.max(route.along,pr.along);
  const rem=Math.max(0,route.total-route.along);
  if(rem<30){$('#turnD').textContent='Arrived';$('#turnI').textContent='';if(!spoken.arr){spoken.arr=1;N.speak('You have arrived');setTimeout(()=>{window.i3stopNav();N.navigationEnded()},8000)}return}
  const next=route.steps.find(x=>x.at>route.along+8)||route.steps[route.steps.length-1],dn=Math.max(0,next.at-route.along),txt=stepText(next.s);
  $('#turnD').textContent=fmtD(dn);$('#turnI').textContent=txt;
  const t=next.s.maneuver.type;$('#arrow').setAttribute('transform',t==='arrive'?'':`rotate(${MOD[next.s.maneuver.modifier]??0} 24 26)`);
  const key=Math.round(next.at);
  if(dn<400&&dn>120&&!spoken[key+'a']){spoken[key+'a']=1;N.speak('In '+fmtD(dn).replace('yd','yards').replace(' mi',' miles').replace(' km',' kilometres').replace(/(\d) m$/,'$1 metres')+', '+txt)}
  if(dn<=60&&!spoken[key+'b']){spoken[key+'b']=1;N.speak(txt)}
  const remSec=route.dur*rem/route.total;
  $('#eArr').textContent=new Date(Date.now()+remSec*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  $('#eRem').textContent=fmtD(rem);
  if(D.soc!=null){const arr=D.soc-(rem/1000/kmPerKwh())/USABLE_KWH*100;$('#eBat').textContent=f(Math.max(0,arr))+'%';$('#eBat').style.color=arr<10?'var(--bad)':arr<20?'var(--warn)':'var(--good)'}
}
log('i3 Dash page ready '+innerWidth+'x'+innerHeight);
showPage();
</script>
